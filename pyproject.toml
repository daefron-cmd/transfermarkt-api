[project]
name = "transfermarkt-api"
version = "4.0.0"
description = "API service to get data from Transfermarkt"
authors = [{ name = "Felipe Allegretti", email = "felipe@allegretti.me" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diskcache>=5.6.3",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "slowapi>=0.1.10",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
    "types-lxml>=2026.2.16",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "FAST", # fastapi
]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies mutable field defaults per instance; RUF012 cannot see the BaseModel ancestry.
"app/schemas/**" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["diskcache", "diskcache.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default: any TCP/DNS use fails loudly. Unix sockets stay allowed for the asyncio
# self-pipe that the TestClient event loop needs. tests/live is deselected ("not live"); run it with
# `-m live --force-enable-socket` (the last -m wins).
addopts = ["--disable-socket", "--allow-unix-socket", "-m", "not live"]
pythonpath = ["."]
markers = [
    "live: hits the live Transfermarkt site over the network",
]

[tool.coverage.run]
source = ["app"]
