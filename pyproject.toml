[project]
name = "transfermarkt-api"
version = "4.0.1"
description = "API service to get data from Transfermarkt"
authors = [{ name = "Felipe Allegretti", email = "felipe@allegretti.me" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diskcache>=5.6.3",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "slowapi>=0.1.10",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "hypothesis>=6.167.1",
    "mutmut>=3.7.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-randomly>=4.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
    "types-lxml>=2026.2.16",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.uv]
package = false
# setup-uv reads this when no workflow-level version is supplied, keeping local
# and CI resolution on the same tested uv release.
required-version = "==0.12.7"

[tool.ruff]
line-length = 120
target-version = "py312"
# ruff >=0.16 formats Python code blocks INSIDE Markdown. The README, CHANGELOG and docs are not source;
# `extend-exclude`, not `exclude` — the latter replaces ruff's own defaults.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "FAST", # fastapi
    "S",    # flake8-bandit (security)
    "PGH003", # no blanket `# type: ignore`
    "PGH004", # no bare `# noqa`
]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies mutable field defaults per instance; RUF012 cannot see the BaseModel ancestry.
"app/schemas/**" = ["RUF012"]
# assert is the point of both product and Pawl test files
"tests/**" = ["S101"]
"mech/tests/**" = ["S101"]
# mech/ is Pawl's, copied verbatim and synced upstream; hold it to Pawl's own rule set (E/F/W/I/UP/S/PGH),
# not this repo's additions, so a fix here never forks upstream bytes. See DEVIATIONS.md.
"mech/**" = ["B", "C4", "SIM", "RUF", "FAST"]

[tool.ruff.format]
# Pawl formats mech/ at ruff's default width, not this repo's 120. See DEVIATIONS.md.
exclude = ["mech/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default: any TCP/DNS use fails loudly. Unix sockets stay allowed for the asyncio
# self-pipe that the TestClient event loop needs. tests/live is deselected ("not live"); run it with
# `-m live --force-enable-socket` (the last -m wins).
addopts = ["--disable-socket", "--allow-unix-socket", "-m", "not live"]
pythonpath = ["."]
markers = [
    "live: hits the live Transfermarkt site over the network",
    "tmapi: backed only by tmapi.transfermarkt.technology, which answers GitHub-hosted runners",
]

[tool.mutmut]
# The product source only, never "mech": Pawl's own survivors are judged upstream and that baseline does not travel.
source_paths = ["app"]
# Burndown ratchet: push CI mutates only the modules whose survivors are classified in MUTANTS.md.
# Grow it per burned-down module; delete it when it covers app/. See DEVIATIONS.md.
only_mutate = [
    "app/api/api.py",
    "app/api/deps.py",
    "app/api/endpoints/clubs.py",
    "app/api/endpoints/competitions.py",
    "app/api/endpoints/players.py",
    "app/http.py",
    "app/main.py",
    "app/schemas/base.py",
    "app/schemas/clubs/fixtures.py",
    "app/schemas/clubs/players.py",
    "app/schemas/clubs/profile.py",
    "app/schemas/clubs/search.py",
    "app/schemas/clubs/squad.py",
    "app/schemas/competitions/clubs.py",
    "app/schemas/competitions/fixtures.py",
    "app/schemas/competitions/search.py",
    "app/schemas/competitions/table.py",
    "app/schemas/players/achievements.py",
    "app/schemas/players/injuries.py",
    "app/schemas/players/jersey_numbers.py",
    "app/schemas/players/market_value.py",
    "app/schemas/players/profile.py",
    "app/schemas/players/search.py",
    "app/schemas/players/stats.py",
    "app/schemas/players/transfers.py",
    "app/services/base.py",
    "app/services/clubs/fixtures.py",
    "app/services/clubs/players.py",
    "app/services/clubs/profile.py",
    "app/services/clubs/search.py",
    "app/services/clubs/squad.py",
    "app/services/competitions/clubs.py",
    "app/services/competitions/fixtures.py",
    "app/services/competitions/search.py",
    "app/services/competitions/table.py",
    "app/services/games.py",
    "app/services/players/achievements.py",
    "app/services/players/injuries.py",
    "app/services/players/jersey_numbers.py",
    "app/services/players/market_value.py",
    "app/services/players/profile.py",
    "app/services/players/search.py",
    "app/services/players/stats.py",
    "app/services/players/transfers.py",
    "app/tmapi.py",
    "app/utils/regex.py",
    "app/utils/utils.py",
    "app/utils/xpath.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
# Push CI treats dependency/config changes as full mutation inputs, so stale cached verdicts must be discarded.
on_dependency_change = "rerun"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["tests/*", "mech/tests/*"]
# Reachability check only — no fail_under threshold, by design.

[tool.mech]
# Commit-gate pyright scope: "whole" | "staged_plus_dependents".
# Flip when a measured cold-cache whole-project run exceeds 10 s — measure first, don't flip on a hunch.
pyright_scope = "whole"
# Tracked proof that Pawl's suite passed against this deployment's current compatibility inputs.
pawl_selftest_record = ".pawl-selftest.json"
# Stop hook declined; see DEVIATIONS.md.
stop_hook = false
