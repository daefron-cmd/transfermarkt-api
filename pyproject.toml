[project]
name = "transfermarkt-api"
version = "3.0.0"
description = "API service to get data from Transfermarkt"
authors = [{ name = "Felipe Allegretti", email = "felipe@allegretti.me" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "diskcache>=5.6.3",
    "fastapi>=0.141.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "schema>=0.7.8",
    "types-lxml>=2026.2.16",
    "types-python-dateutil>=2.9.0.20260807",
    "types-requests>=2.33.0.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "FAST", # fastapi
]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies mutable field defaults per instance; RUF012 cannot see the BaseModel ancestry.
"app/schemas/**" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["diskcache", "diskcache.*"]
ignore_missing_imports = true

# Pre-existing typing debt (84 errors in services, 6 in endpoints as of the uv migration).
# Remove these overrides as the modules are cleaned up.
[[tool.mypy.overrides]]
module = ["app.services.*"]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "index",
    "misc",
    "no-redef",
    "operator",
    "union-attr",
    "valid-type",
]

[[tool.mypy.overrides]]
module = ["app.api.endpoints.*"]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits the live Transfermarkt site over the network",
]

[tool.coverage.run]
source = ["app"]
