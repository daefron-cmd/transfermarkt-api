name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy app

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "not live" -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
      # PYSEC-2026-2447 (CVE-2025-69872, GHSA-w8v5-vhqr-4h9v): diskcache <=5.6.3 unpickles cache
      # entries, so write access to CACHE_DIR allows code execution. No fixed release exists yet;
      # CACHE_DIR is local to the app user. Remove the ignore once diskcache ships a fix.
      - run: uv run pip-audit --strict -r requirements-audit.txt --ignore-vuln PYSEC-2026-2447

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t transfermarkt-api:ci .
